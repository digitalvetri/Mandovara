name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mandovara
          POSTGRES_PASSWORD: mandovara
          POSTGRES_DB: mandovara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandovara -d mandovara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mandovara:mandovara@localhost:5432/mandovara?schema=public
      DIRECT_URL: postgresql://mandovara:mandovara@localhost:5432/mandovara?schema=public
      # Signed session-cookie secret. Hardcoded test-only value — production
      # runs its own separate secret set on Coolify. Must be 32+ chars.
      SESSION_SECRET: ci_test_secret_do_not_use_in_production_c8a4f217b93e6d
      # No TLS in CI, browser wouldn't store Secure cookies over http://localhost
      COOKIE_SECURE: "false"
      # §3.2 / §12.3 — the app must connect as the RESTRICTED role, not the
      # owner. Postgres silently exempts superusers from row security, so
      # without this the isolation suite skips entirely (describe.skipIf) and
      # a gate CLAUDE.md calls blocking never actually runs. Test-only
      # credentials; the role is created below, after migrations.
      APP_DB_PASSWORD: ci_app_role_password_not_a_secret
      APP_DATABASE_URL: postgresql://mandovara_app:ci_app_role_password_not_a_secret@localhost:5432/mandovara?schema=public
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      # Must run AFTER migrate deploy so the grants cover every table the
      # migrations just created. Idempotent.
      - name: Create restricted app role
        run: node scripts/setup-app-role.mjs

      # Cheap, and catches the failure mode that took the deploy workflow
      # down on 2026-08-28: a malformed workflow does not fail a step, it
      # fails the whole run before any step, with no useful message.
      - name: Validate GitHub Actions workflows
        run: pnpm check:workflows

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Browser binaries only — deliberately NOT `--with-deps`.
      #
      # `--with-deps` shells out to apt-get, and on 2026-08-19 that hung for
      # 23 minutes on two consecutive runs (1392s, killed by the job timeout)
      # having taken 21s an hour earlier — an apt lock or mirror stall on the
      # hosted runner, nothing to do with the code. The ubuntu-latest image
      # already ships the shared libraries chromium needs, so the apt step was
      # buying almost nothing and could take the whole pipeline down at any
      # time. If a library ever genuinely goes missing, the E2E step fails
      # immediately with the missing .so named — a far better signal than a
      # silent 23-minute stall.
      #
      # The cache makes the common case a no-op. Keyed on the resolved
      # Playwright version so a dependency bump re-downloads rather than
      # launching a browser against mismatched drivers.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(pnpm exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: pnpm playwright install chromium

      # E2E specs (lead-list card assertions, project detail, the §12.2
      # scenarios) expect a baseline of realistic data. Without SEED_DEMO_DATA
      # the seed plants catalog + users ONLY — no clients, projects, orders or
      # stock — and every data-dependent assertion times out on an empty DB.
      # The demo seed is ~4s and ~56k rows, well inside the §11 60s gate.
      - name: Seed test data
        run: pnpm db:seed
        env:
          SEED_DEMO_DATA: "true"

      - name: E2E tests
        run: pnpm test:e2e --project=chromium

      # The permission matrix — 9 roles x 25 routes, including the §12.2/6
      # gate that an INSTALLER can reach neither cost nor margin.
      #
      # It is a SEPARATE Playwright project (chromium and mobile-android
      # both testIgnore the spec), so `--project=chromium` above never
      # touched it. Between that and a self-skipping guard inside the spec,
      # these 225 tests had never executed a single assertion — they were
      # reported green for months. Guard fixed 2026-08-28; this step is
      # what stops it going quiet again.
      #
      # ~45s on a hosted runner, single worker by config.
      - name: E2E — RBAC permission matrix
        run: pnpm test:e2e --project=rbac-matrix

      # Actions logs need auth to download, so a red E2E run is otherwise
      # opaque from outside the repo. The report and traces make it readable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
