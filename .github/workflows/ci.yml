name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mandovara
          POSTGRES_PASSWORD: mandovara
          POSTGRES_DB: mandovara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandovara -d mandovara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mandovara:mandovara@localhost:5432/mandovara?schema=public
      DIRECT_URL: postgresql://mandovara:mandovara@localhost:5432/mandovara?schema=public
      # Signed session-cookie secret. Hardcoded test-only value — production
      # runs its own separate secret set on Coolify. Must be 32+ chars.
      SESSION_SECRET: ci_test_secret_do_not_use_in_production_c8a4f217b93e6d
      # No TLS in CI, browser wouldn't store Secure cookies over http://localhost
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      # E2E specs (lead-list card assertions, project detail, etc.) expect a
      # baseline of realistic data. Without this the "cards show tel: links"
      # assertions time out on an empty DB.
      - name: Seed test data
        run: pnpm db:seed

      - name: E2E tests
        run: pnpm test:e2e --project=chromium
