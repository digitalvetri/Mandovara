name: Deploy to Coolify

# Chains after the CI workflow — only deploys when typecheck, lint,
# tests and build all pass on main. Coolify's own webhook endpoint
# would deploy immediately on push without any gate, which risks
# shipping broken code. Going through Actions keeps CI gating intact.

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    # Only fire when CI succeeded. The workflow_run trigger fires on
    # both success and failure — we filter here.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger + wait for Coolify deployment (with retry)
        env:
          COOLIFY_URL:      ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN:    ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COMMIT_SHA:       ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG:       ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -uo pipefail
          echo "→ Triggering Coolify deploy for $COMMIT_SHA"
          echo "  $COMMIT_MSG" | head -1

          # Coolify build failures are usually transient (registry timeout,
          # docker daemon hiccup, mid-build restart). Retry up to 3 times
          # with 30s backoff. `finished` short-circuits; `failed` /
          # `cancelled` / timeout roll into the next attempt.
          MAX_ATTEMPTS=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo ""
            echo "=== Attempt $attempt of $MAX_ATTEMPTS ==="

            # force=true builds from source even when the image cache says
            # nothing changed — cheap when nothing did, and eliminates the
            # "why isn't my change showing?" class of confusion.
            RESPONSE=$(curl -sS -f -X POST \
              "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true" \
              -H "Authorization: Bearer $COOLIFY_TOKEN") || {
                echo "✗ Attempt $attempt: could not queue deployment (network / API)"
                attempt=$((attempt + 1))
                sleep 30
                continue
              }

            DEP=$(echo "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])')
            echo "→ Deployment queued: $DEP"
            echo "→ Log URL: $COOLIFY_URL/project/p118chljg5wzdas0f2a8hm0y/environment/production/application/$COOLIFY_APP_UUID/deployment/$DEP"

            # Poll THIS deployment UUID (not the app.status) until Coolify
            # settles it. The app's own status is `running:unknown`
            # throughout — checking it is the classic "polls the wrong
            # signal" bug and returns instantly.
            END=$(( $(date +%s) + 900 ))
            STATUS="in_progress"
            while [ "$(date +%s)" -lt "$END" ]; do
              STATUS=$(curl -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
                "$COOLIFY_URL/api/v1/deployments/$DEP" \
                | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
              echo "[$(date +%H:%M:%S)] attempt=$attempt deployment=$STATUS"
              case "$STATUS" in
                finished|failed|cancelled) break ;;
                *)                          sleep 20 ;;
              esac
            done

            if [ "$STATUS" = "finished" ]; then
              echo ""
              echo "✓ Deploy successful on attempt $attempt"
              exit 0
            fi

            echo "✗ Attempt $attempt ended with status=$STATUS"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$MAX_ATTEMPTS" ]; then
              echo "→ Waiting 30s before next attempt..."
              sleep 30
            fi
          done

          echo ""
          echo "✗ All $MAX_ATTEMPTS deploy attempts exhausted"
          exit 1
