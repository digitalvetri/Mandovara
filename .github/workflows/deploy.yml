name: Deploy to Coolify

# Chains after the CI workflow — only deploys when typecheck, lint,
# tests and build all pass on main. Coolify's own webhook endpoint
# would deploy immediately on push without any gate, which risks
# shipping broken code. Going through Actions keeps CI gating intact.

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    # Only fire when CI succeeded. The workflow_run trigger fires on
    # both success and failure — we filter here.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger + wait for Coolify deployment
        env:
          COOLIFY_URL:      ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN:    ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COMMIT_SHA:       ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG:       ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          echo "→ Triggering Coolify deploy for $COMMIT_SHA"
          echo "  $COMMIT_MSG" | head -1

          # Ask Coolify to pull + rebuild. force=true builds from source
          # even when the image cache says nothing changed — cheap when
          # nothing did, and eliminates the "why isn't my change showing?"
          # class of confusion.
          RESPONSE=$(curl -sS -f -X POST \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")

          DEP=$(echo "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])')
          echo "→ Deployment queued: $DEP"
          echo "→ Log URL: $COOLIFY_URL/project/p118chljg5wzdas0f2a8hm0y/environment/production/application/$COOLIFY_APP_UUID/deployment/$DEP"

          # Poll the DEPLOYMENT (not the app) until Coolify marks it
          # finished / failed / cancelled. The app's own `status` field
          # says `running:unknown` throughout — checking it is the
          # classic "polls the wrong signal" bug and returns instantly.
          END=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            STATUS=$(curl -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEP" \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
            echo "[$(date +%H:%M:%S)] deployment=$STATUS"
            case "$STATUS" in
              finished)  echo "→ Deploy successful"; exit 0 ;;
              failed)    echo "✗ Deploy failed";     exit 1 ;;
              cancelled) echo "✗ Deploy cancelled";  exit 1 ;;
              *)         sleep 20 ;;
            esac
          done
          echo "✗ Deploy did not settle within 15 minutes"
          exit 1
