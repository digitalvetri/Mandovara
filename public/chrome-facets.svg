<svg xmlns="http://www.w3.org/2000/svg" width="264" height="880" viewBox="0 0 264 880" fill="none">
  <!--
    Rail facets — replaces the line-art of wallpaper rolls and swatch fans.
    Same crystalline language as the hero, so the rail and the hero band read
    as one surface catching light rather than two unrelated decorations.

    Kept to long shallow diagonals: at 264px wide anything busier turns to fog
    on a laptop, which is exactly what the previous motif did. Tiles vertically;
    the geometry is continuous across the seam because every edge that meets
    y=0 also meets y=880 at the same x.
  -->
  <defs>
    <linearGradient id="rail-a" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#CFFFF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#CFFFF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rail-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#CFFFF6" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#CFFFF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFFFF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Two broad panes running the full height, so the seam never shows. -->
    <polygon points="-40,880 150,0 236,0 46,880" fill="url(#rail-a)"/>
    <polygon points="176,880 320,0 264,0 264,140 120,880" fill="url(#rail-a)" opacity="0.7"/>

    <!-- Lit edges, faded at both ends so the tile boundary is invisible. -->
    <path d="M150,0 L-40,880"  stroke="url(#rail-line)" stroke-width="1"/>
    <path d="M236,0 L46,880"   stroke="url(#rail-line)" stroke-width="0.75"/>
    <path d="M320,0 L176,880"  stroke="url(#rail-line)" stroke-width="0.75"/>
  </g>
</svg>
